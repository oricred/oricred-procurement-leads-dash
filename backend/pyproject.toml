[project]
name = "oricred-backend"
version = "0.1.0"
description = "Oricred Procurement Intelligence Platform — Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "asyncpg>=0.31",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "structlog>=24.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Staged adoption — see docs/specifications/remediation-07-engineering-hygiene.md §1.2.
# Stage 1 (enforced now): the rules that catch bugs — F, I, N, and the E rules below.
# Stage 2 (next): drop E402 by moving misplaced imports, then drop E501 in a single
#   formatting-only commit recorded in .git-blame-ignore-revs.
ignore = [
    "E501",  # line too long — 245 occurrences, deferred to the formatting commit
    "E402",  # import not at top of file — 30 occurrences in jobs/, deferred with it
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Staged adoption — see remediation-07 §1.2. Strict on the modules where a type
# error is expensive; the rest are silenced and re-enabled one module per PR.
disallow_untyped_defs = false
strict = false

[[tool.mypy.overrides]]
module = [
    "app.clients.*",
    "app.workflow",
    "app.utils",
]
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.api.*",
    "app.models.*",
    "app.services.*",
    "app.jobs.*",
    "app.schemas.*",
    "app.main",
    "app.database",
    "app.config",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

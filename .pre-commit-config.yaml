# Optional local gate. CI is the authority (.github/workflows/ci.yml); this just
# moves the same ruff check earlier so it is a formality rather than a surprise.
#
#   pip install pre-commit && pre-commit install
#
# Pinned to the ruff version in backend/pyproject.toml's dev extra.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

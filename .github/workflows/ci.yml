name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Stage 1 of the lint adoption in remediation-07 §1.2. E501 and E402 are
      # ignored in pyproject.toml until the formatting commit lands; every other
      # rule in the E/F/I/N/W set is enforced here.
      #
      # This step exists because ruff already detected the platform's most
      # serious defect (three undefined names in tsa_db.py) and nothing ran it.
      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this gates on type errors
      # as well as a successful bundle.
      - name: Type check and build
        run: npm run build
